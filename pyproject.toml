[project]
name = "metric-atelier"
version = "0.1.0"
description = "Import, group, annotate, and compare video quality metric CSVs for thesis-ready figures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaleido>=0.2.1",
    "nicegui>=2.21",
    "pandas>=2.2",
    "plotly>=5.24",
    "pydantic>=2.0",
    "sqlmodel>=0.0.22",
]

[project.scripts]
metric-atelier = "metric_atelier.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
